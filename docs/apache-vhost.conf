# rfyglobal.org — Apache vhost on the Webuzo VPS (159.198.47.232)
# Lives at /var/webuzo-data/apache2/custom/domains/rfyglobal.org.conf (reference copy; edit on the server).
# Cloudflare sits in front. Next.js: 127.0.0.1:3001 (PM2 `rfyglobal`). Webhook: 127.0.0.1:9002 (PM2 `rfyglobal-webhook`).

<VirtualHost *:80>
    ServerName rfyglobal.org
    ServerAlias www.rfyglobal.org

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName rfyglobal.org
    ServerAlias www.rfyglobal.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/rfyglobal.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rfyglobal.org/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    # Uploads (base64 JSON) and SSE streams need more than the 60s default.
    ProxyTimeout 300

    # Webhook — MUST come before the catch-all
    ProxyPass        /deploy http://127.0.0.1:9002/deploy
    ProxyPassReverse /deploy http://127.0.0.1:9002/deploy

    # App — catch-all (media at /uploads/* is served by the app from $UPLOAD_DIR)
    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ErrorLog /var/log/apache2/rfyglobal.org-error.log
    CustomLog /var/log/apache2/rfyglobal.org-access.log combined
</VirtualHost>

